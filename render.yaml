services:
  - type: web
    name: nfl-picks-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: nfl-picks-db
          property: connectionString
      - key: ADMIN_KEY
        generateValue: true
      - key: FRONTEND_URL
        sync: false   # set this to your Netlify URL after deploy

databases:
  - name: nfl-picks-db
    plan: free
    databaseName: nfl_picks
    user: nfl_picks_user
